services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      FRONTEND_URL: http://localhost:5173
    volumes:
      - ./backend/data:/app/data
  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    volumes:
      - .:/app
      - /app/node_modules
